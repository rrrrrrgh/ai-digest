name: AI 项目雷达
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:
    inputs:
      force:
        description: '无视周期，立刻发一期'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓 → 组 → 渲 → 发微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python cloud_digest.py --force
          else
            python cloud_digest.py
          fi
      - name: 回写状态（防止 60 天不活动被停）
        if: always()
        run: |
          git config user.name 'ai-digest-bot'
          git config user.email 'ai-digest-bot@users.noreply.github.com'
          git add -A .
          git commit -m "digest $(date -u +%F)" || echo "没有变化"
          git push || echo "推送失败，不影响本期"
