name: AI 项目雷达

# 电脑关着也能推：GitHub 的服务器替你跑，不依赖你本机，也不用开梯子。
# 每天 23:30 UTC（北京 07:30）检查一次；GitHub 的定时会有几分钟到几十分钟延迟，所以留了半小时缓冲，实际落在 7:30~8:00。
# 真正发不发由 due.py 判断（距上期满 3 天才发）。
# 就算被重复触发，due.py 也会拦住「距上期不满 2.5 天」的重复发送。
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '无视周期，立刻发一期'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓项目 → 组一期 → 渲染 → 发微信（一个入口）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FAV_BASE: ${{ secrets.FAV_BASE }}
          FAV_KEY: ${{ secrets.FAV_KEY }}
          FAV_REPO: ${{ secrets.FAV_REPO }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python cloud_digest.py --force
          else
            python cloud_digest.py
          fi

      - name: 回写状态（顺便防止 60 天不活动被自动停掉）
        if: always()
        run: |
          git config user.name 'ai-digest-bot'
          git config user.email 'ai-digest-bot@users.noreply.github.com'
          git add -A .   # build/、candidates.json、channels.json 都在 .gitignore 里
          git commit -m "digest $(date -u +%F)" || echo "没有变化"
          git push || echo "推送失败（可能没有写权限），不影响本期"
